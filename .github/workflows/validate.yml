name: Validate Registry

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MMD_REGISTRY_PRIVATE_PMX: ""
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall mmd_registry tests check_assets.py

      - name: Run PMX edit, portability, and compatibility safety matrix
        run: >
          python -m unittest -q
          tests.test_pmx_edit_generated_matrix
          tests.test_pmx_private_edit_validation
          tests.test_pmx_edit_cli_diagnostics
          tests.test_pmx_edit_plan_authoring_failures
          tests.test_pmx_edit_plan_cli
          tests.test_pmx_edit_plan_explain
          tests.test_pmx_edit_plan_template
          tests.test_pmx_edit_operation_catalog
          tests.test_pmx_edit_negative_safety
          tests.test_pmx_private_failure_validation
          tests.test_texture_path_semantics
          tests.test_texture_portability
          tests.test_texture_rewrite
          tests.test_texture_portability_cli
          tests.test_texture_portability_generated_matrix
          tests.test_pmx_compatibility_profiles
          tests.test_pmx_compatibility_reader_scanner
          tests.test_pmx_compatibility_boundaries
          tests.test_pmx_compatibility_writer_roundtrip
          tests.test_pmx_compatibility_cross_feature
          tests.test_pmx_compatibility_private_runtime
          tests.test_v08_contract_freeze
          tests.test_pmx_roundtrip_cli_diagnostics
          tests.test_pmx_destination_safety
          tests.test_pmx_edit_replay_determinism
          tests.test_pmx_capability_manifest
          tests.test_pmx_cross_feature_state_isolation
          tests.test_v08_backward_compatibility

      - name: Run automated tests
        run: python -m unittest discover -s tests -q

      - name: Check release-facing commands
        run: |
          python -c "from mmd_registry import __version__; assert __version__ == '0.8.5'"
          python check_assets.py --version
          python check_assets.py scan --help
          python check_assets.py roundtrip --help
          python check_assets.py edit --help
          python check_assets.py edit-plan --help
          python check_assets.py edit-plan catalog --help
          python check_assets.py edit-plan template --help
          python check_assets.py edit-plan explain --help
          python check_assets.py texture-portability --help
          python check_assets.py doctor --help
          python check_assets.py bones --help
          python check_assets.py rig --help

      - name: Validate registry with legacy syntax
        run: python check_assets.py --mode private --no-report

      - name: Validate registry with explicit command
        run: python check_assets.py validate --mode private --no-report

      - name: Verify registered placeholder hash
        run: >
          python check_assets.py hash
          sample_assets/demo_mannequin/model.pmx
          --expected
          e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
